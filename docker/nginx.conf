server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    gzip on;
    gzip_types text/css application/javascript application/json;
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    location = /_auth {
        internal;
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $auth_upstream auth:8091;
        proxy_pass http://$auth_upstream/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }
    location ^~ /api/auth/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $auth_upstream auth:8091;
        proxy_pass http://$auth_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 4k;
        access_log off;
    }
    error_page 401 = @unauthorized;
    location @unauthorized {
        default_type application/json;
        return 401 '{"error":"登录已过期，请重新登录"}';
    }
    location ^~ /api/settings/ {
        auth_request /_auth;
        # Resolve again after a collector container replacement.
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $settings_upstream collector:8090;
        proxy_pass http://$settings_upstream;
        proxy_set_header Host $http_host;
        client_max_body_size 48k;
        proxy_read_timeout 10s;
        access_log off;
    }
    location /api/ {
        auth_request /_auth;
        add_header Cache-Control "no-store" always;
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $api_upstream backend:8080;
        proxy_pass http://$api_upstream;
        proxy_read_timeout 15s;
    }
    location /ws {
        auth_request /_auth;
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $stream_upstream auth:8091;
        proxy_pass http://$stream_upstream;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 75s;
    }
    location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
